# Telegram 白名单 Bot 配置示例
# 复制为 config.toml 并填写真实值；chmod 600 config.toml

[bot]
# Telegram Bot Token（从 @BotFather 获取）
token = "1234567890:AAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# 主管理员 Telegram user_id（数字 ID，可从 @userinfobot 获取）
primary_admin = 123456789

[proxy]
# SOCKS5 代理地址（Bot 访问 Telegram API 使用）
# 格式：socks5h://[user:pass@]host:port
# socks5h 表示 DNS 由代理端解析（推荐，防 DNS 泄漏）
url = "socks5h://127.0.0.1:1080"

# 若代理需要认证，可在 URL 中包含，或单独填写：
# username = ""
# password = ""

[geo]
# 离线数据目录（存放 iplist cncity/*.txt 和 ip2region xdb）
# 相对于 config.toml 所在目录，或填绝对路径
data_dir = "data"

# 在线 IP 归属查询 provider（/whois 正向查询用，不能反查省市 CIDR）
# 当前仅支持 ip-api（免 key，无需任何 API 凭据，走配置的 SOCKS5 代理）
online_provider = "ip-api"

# IP2Location.io API Key（可选，免费额度 50,000 次/月）
# 注册：https://www.ip2location.io/
# 留空则跳过 IP2Location.io，降级至下一个 provider
# 也可通过环境变量 TGWL_IP2LOCATION_IO_KEY 注入（优先级更高）
# ip2location_io_key = ""

# ip2region 离线 xdb 文件路径（可选，用于本地精度优化）
# 可通过 scripts/fetch_geo.py --ip2region-xdb 下载
# 留空则跳过离线 xdb，仅使用在线 provider
# 也可通过环境变量 TGWL_IP2REGION_XDB 注入（优先级更高）
# ip2region_xdb = "data/ip2region.xdb"

[database]
# SQLite 数据库文件路径（相对或绝对）
path = "whitelist.db"

[cf_pull]
# CF Worker 自动加白 —— 服务器侧定时 pull
# 由部署在 Cloudflare Workers 的中转服务推送待加白 IP，
# Bot 按 poll_interval_seconds 轮询并将结果写入 nftables 白名单。
#
# 凭据为 Cloudflare Access Service Token：
#   https://developers.cloudflare.com/cloudflare-one/identity/service-tokens/
# 出站请求走 [proxy] 中配置的 SOCKS5 代理。

# 是否启用定时拉取（默认关闭）
enabled = false

# CF Worker 端点 URL（例：https://wl-pull.example.workers.dev）
worker_url = ""

# Cloudflare Access Service Token Client ID（CF-Access-Client-Id 请求头）
access_client_id = ""

# Cloudflare Access Service Token Client Secret（CF-Access-Client-Secret 请求头）
access_client_secret = ""

# 轮询间隔（秒），默认 300 秒 / 5 分钟
poll_interval_seconds = 300
